spring:
  application:
    name: ledger-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/ledgerlab?reWriteBatchedInserts=true
    username: ledger
    password: ledger
    hikari:
      schema: ledger
  flyway:
    default-schema: ledger
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ledger
      auto-offset-reset: earliest
      properties:
        max.poll.records: 500
    producer:
      acks: all
    listener:
      concurrency: 3
      # Topics come from infrastructure (ADR 0008); a name that does not match fails the start.
      missing-topics-fatal: true

ledger:
  topic:
    name: transfers
  results:
    topic: transfer-results
    publish-interval: 50ms
    batch-size: 500
    send-timeout: 30s
  consumer:
    retry-backoff: 500ms
  run-duplicates:
    # Past the last scrape after the run, before a long-lived pod publishes every past run.
    idle-retention: 10m
    sweep-interval: 1m

springdoc:
  # Otherwise every controller-local error handler is added to every operation as a possible answer.
  override-with-generic-response: false

logging:
  pattern:
    correlation: "[run=%X{runId:-}] "

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, kafkaAssignment
