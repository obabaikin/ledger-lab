spring:
  application:
    name: ledger-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/ledgerlab?reWriteBatchedInserts=true
    username: ledger
    password: ledger
    hikari:
      schema: ledger
  flyway:
    default-schema: ledger
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ledger
      auto-offset-reset: earliest
      properties:
        max.poll.records: 500
    producer:
      acks: all
    listener:
      concurrency: 3
      # Topics come from infrastructure (ADR 0008); a name that does not match fails the start.
      missing-topics-fatal: true

ledger:
  topic:
    name: transfers
  results:
    topic: transfer-results
    publish-interval: 50ms
    batch-size: 500
    send-timeout: 30s
  consumer:
    retry-backoff: 500ms
    # Set per instance in Kubernetes (the StatefulSet pod name); unset, the consumer joins the group dynamically.
    instance-id: ${LEDGER_INSTANCE_ID:}
  run-duplicates:
    # Past the last scrape after the run, before a long-lived pod publishes every past run.
    idle-retention: 10m
    sweep-interval: 1m
  reconciliation:
    # Per query, below control's 5 s call timeout: the database stops a query control has already given up on.
    statement-timeout: 4s
  chaos:
    # On in the chart only: POST /actuator/crash halts the instance (control's chaos button).
    enabled: false
    halt-delay: 200ms

springdoc:
  # Otherwise every controller-local error handler is added to every operation as a possible answer.
  override-with-generic-response: false

logging:
  pattern:
    correlation: "[run=%X{runId:-}] "

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,crash
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
