spring:
  kafka:
    listener:
      concurrency: 2
ledger:
  topic:
    name: transfers
  results:
    topic: transfer-results
    publish-interval: 20ms
    batch-size: 100
    send-timeout: 30s
  consumer:
    retry-backoff: 200ms
logging:
  level:
    org.apache.kafka: WARN
    org.springframework.kafka: WARN
