gateway:
  transfers-topic: transfers
  results-topic: transfer-results
  outbox:
    publish-interval: 20ms
    batch-size: 100
    send-timeout: 30s
  consumer:
    retry-backoff: 200ms
  max-wait: 5s
  retry-after: 1s
  close-lock-timeout: 1s
  warm-up:
    rounds: 20
logging:
  level:
    org.apache.kafka: WARN
    org.springframework.kafka: WARN
