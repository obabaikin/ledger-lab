spring:
  application:
    name: gateway
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/ledgerlab?reWriteBatchedInserts=true
    username: gateway
    password: gateway
    hikari:
      schema: gateway
  flyway:
    default-schema: gateway
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: gateway
      auto-offset-reset: earliest
    producer:
      acks: all
    listener:
      concurrency: 3
      # Topics come from infrastructure (ADR 0008); a name that does not match fails the start.
      missing-topics-fatal: true

server:
  port: 8081

gateway:
  transfers-topic: transfers
  results-topic: transfer-results
  outbox:
    publish-interval: 50ms
    batch-size: 500
    send-timeout: 30s
  consumer:
    retry-backoff: 500ms
  max-wait: 10s
  retry-after: 1s
  close-lock-timeout: 5s

springdoc:
  # Only the client-facing API is published: /internal has no outside consumers.
  paths-to-exclude: /internal/**
  # Each endpoint lists its own answers; otherwise every controller-local error handler is added to every operation.
  override-with-generic-response: false

logging:
  pattern:
    correlation: "[run=%X{runId:-}] "

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
