spring:
  application:
    name: gateway
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/ledgerlab?reWriteBatchedInserts=true
    username: gateway
    password: gateway
    hikari:
      schema: gateway
      # Milliseconds. Well below the client's 5 s: a request that waits longer for a connection is answered after the client gave up.
      connection-timeout: 2000
  flyway:
    default-schema: gateway
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: gateway
      auto-offset-reset: earliest
    producer:
      acks: all
    listener:
      concurrency: 3
      # Topics come from infrastructure (ADR 0008); a name that does not match fails the start.
      missing-topics-fatal: true

server:
  port: 8081

gateway:
  transfers-topic: transfers
  results-topic: transfer-results
  outbox:
    publish-interval: 50ms
    batch-size: 500
    send-timeout: 30s
  consumer:
    retry-backoff: 500ms
  max-wait: 10s
  retry-after: 1s
  close-lock-timeout: 5s
  admission:
    # About three times what 300 TPS keeps in flight (0.1 s each); measured against the server in a trial.
    max-concurrent: 100
    wait: 200ms
  warm-up:
    # After a deploy a cold gateway answered 300 TPS with a wave of 503 busy (measured on the server); a warm one did not.
    rounds: 2000
    duration: 5s
    # All services start cold together after a deploy: 5 s got 519 to 1312 of the 2000 rounds (measured on the server).
    max-duration: 90s

springdoc:
  # Each endpoint lists its own answers; otherwise every controller-local error handler is added to every operation.
  override-with-generic-response: false

logging:
  pattern:
    correlation: "[run=%X{runId:-}] "

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
