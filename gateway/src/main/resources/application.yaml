spring:
  application:
    name: gateway
  lifecycle:
    # Per phase of the stop: the web server's drain (the longest wait is 10 s), then the Kafka listeners. With the pause
    # before the stop they fit the pod's grace period (infra/helm/ledger-lab/values.yaml).
    timeout-per-shutdown-phase: 15s
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/ledgerlab?reWriteBatchedInserts=true
    username: gateway
    password: gateway
    hikari:
      schema: gateway
      # Milliseconds. Well below the client's 5 s: a request that waits longer for a connection is answered after the client gave up.
      connection-timeout: 2000
  flyway:
    default-schema: gateway
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: gateway
      auto-offset-reset: earliest
    producer:
      acks: all
    listener:
      concurrency: 3
      # Topics come from infrastructure (ADR 0008); a name that does not match fails the start.
      missing-topics-fatal: true

server:
  port: 8081
  # A deploy stops the old pod after the new one is ready: requests it holds, waits included, are answered first.
  shutdown: graceful
  tomcat:
    # Above the in-flight limit, so a submission over it gets 503 busy instead of waiting for a connection.
    max-connections: 3500

gateway:
  transfers-topic: transfers
  results-topic: transfer-results
  outbox:
    publish-interval: 50ms
    batch-size: 500
    send-timeout: 30s
  consumer:
    retry-backoff: 500ms
  max-wait: 10s
  wait-read:
    # The recorder commits a result about 25 ms after the event wakes the request (median, measured on the server).
    first-pause: 25ms
    # Reads at about 25, 75, 175, 375 and 775 ms; a result the recorder has not committed by then is 202, asked again later.
    max-reads: 5
  retry-after: 1s
  close-lock-timeout: 5s
  inflight:
    # In a stall of the database 1500 open submissions took the live heap from about 180 to 650 MB on the server, about
    # 0.3 MB each; 2000 leaves room in the heap the chart gives the gateway.
    max-concurrent: 2000
  admission:
    # Rides out about two seconds of a stalled commit at 700 TPS; the in-flight limit holds these and the ones waiting.
    max-concurrent: 1500
    # Two seconds still met 503 busy at the hour's stalls on the server, and those waiting held places in flight.
    wait: 1s
  accept:
    batch-size: 200
    # More writers keep the database busy while one commits; as many as connections would undo the batching.
    writers: 2
    # The client gives up after 5 s; an answer later than that reaches nobody.
    answer-timeout: 5s
  warm-up:
    # After a deploy a cold gateway answered 300 TPS with a wave of 503 busy (measured on the server); a warm one did not.
    rounds: 2000
    duration: 5s
    # All services start cold together after a deploy: 5 s got 519 to 1312 of the 2000 rounds (measured on the server).
    max-duration: 90s
  periods:
    # The same in every service: they cut time at the same instants.
    length: 60m
    # How long a period's transfers are held after it ended, and how long a repeated key gets the first answer.
    retention: 4h
    # Every connection that reads a table keeps a cache entry per partition: 313 partitions took 21 MB a connection and
    # Postgres out of its memory (k3d, 10-minute periods). Maintenance creates them every minute.
    partitions-ahead: 6h
    maintenance-interval: 1m
    # Creating or dropping a partition holds up every submission while it waits for the table.
    lock-timeout: 2s
    # A minute's expired keys at a time: a period's at once (1.44 million at 400 TPS) would be a burst of WAL and dead rows.
    key-cleanup-interval: 1m
    # After the warm-up (warm-up.max-duration).
    key-cleanup-first-delay: 5m
    key-cleanup-batch: 10000
    # Rows left outside the partitions are deleted this many a statement: one long delete would hold up another instance's
    # partition change, and every insert queued behind it.
    unpartitioned-delete-batch: 10000
  latency:
    # The same values as control's control.posting.typical and tail, which count the transfers within each of them.
    slo-thresholds: 3s, 5s

springdoc:
  # Each endpoint lists its own answers; otherwise every controller-local error handler is added to every operation.
  override-with-generic-response: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
