spring:
  application:
    name: gateway
  lifecycle:
    # The pod's grace period (30 s) less the pause before the stop (5 s), with room left: the longest wait is 10 s.
    timeout-per-shutdown-phase: 20s
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/ledgerlab?reWriteBatchedInserts=true
    username: gateway
    password: gateway
    hikari:
      schema: gateway
      # Milliseconds. Well below the client's 5 s: a request that waits longer for a connection is answered after the client gave up.
      connection-timeout: 2000
  flyway:
    default-schema: gateway
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: gateway
      auto-offset-reset: earliest
    producer:
      acks: all
    listener:
      concurrency: 3
      # Topics come from infrastructure (ADR 0008); a name that does not match fails the start.
      missing-topics-fatal: true

server:
  port: 8081
  # A deploy stops the old pod after the new one is ready: requests it holds, waits included, are answered first.
  shutdown: graceful
  tomcat:
    # Above the in-flight limit, so a submission over it gets 503 busy instead of waiting for a connection.
    max-connections: 3000

gateway:
  transfers-topic: transfers
  results-topic: transfer-results
  outbox:
    publish-interval: 50ms
    batch-size: 500
    send-timeout: 30s
  consumer:
    retry-backoff: 500ms
  max-wait: 10s
  wait-read:
    # The recorder commits a result about 25 ms after the event wakes the request (median, measured on the server).
    first-pause: 25ms
    # Reads at about 25, 75, 175, 375 and 775 ms; a result the recorder has not committed by then is 202, asked again later.
    max-reads: 5
  retry-after: 1s
  close-lock-timeout: 5s
  inflight:
    # An open submission holds about 120 KB of heap (heap dump on the server); 1500 is about 180 MB of the gateway's heap.
    max-concurrent: 1500
  admission:
    # About three times what 300 TPS keeps in flight (0.1 s each); measured against the server in a trial.
    max-concurrent: 100
    wait: 200ms
  accept:
    batch-size: 200
    # More writers keep the database busy while one commits; as many as connections would undo the batching.
    writers: 2
    # The client gives up after 5 s; an answer later than that reaches nobody.
    answer-timeout: 5s
  warm-up:
    # After a deploy a cold gateway answered 300 TPS with a wave of 503 busy (measured on the server); a warm one did not.
    rounds: 2000
    duration: 5s
    # All services start cold together after a deploy: 5 s got 519 to 1312 of the 2000 rounds (measured on the server).
    max-duration: 90s

springdoc:
  # Each endpoint lists its own answers; otherwise every controller-local error handler is added to every operation.
  override-with-generic-response: false

logging:
  pattern:
    correlation: "[run=%X{runId:-}] "

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
