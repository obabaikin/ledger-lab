name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # Images are built once, for each commit on main; a release tag only adds its name to that commit's images.
    tags: ['v*']

permissions:
  contents: read

env:
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
  MODULES: ledger-service gateway generator control reporting

concurrency:
  # A new push to a pull request makes its earlier run pointless; every commit on main gets its own run.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew check
      # A run stopped by the time limit ends as cancelled, and that is when the reports are needed most.
      - if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}" gitleaks
      - name: Scan the whole history
        run: ./gitleaks git --redact --no-banner

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TERRAFORM_IMAGE: hashicorp/terraform:1.16.6@sha256:bfffc1ded5fbf0a17beaaf22eb4793980abdb19d0761ff6a3a0efb2ab4d9b316
      SHELLCHECK_IMAGE: koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Terraform cannot order a server
        run: |
          if grep -rEn 'resource +"contabo_(instance|object_storage|private_network|image)"' infra/terraform; then
            echo "the server is bought by hand; Terraform only reads it" >&2
            exit 1
          fi
      - name: Terraform format and validate, without provider credentials
        run: |
          tf() { docker run --rm -u "$(id -u):$(id -g)" -v "$PWD/infra/terraform:/w" -w /w "$TERRAFORM_IMAGE" "$@"; }
          tf fmt -check -recursive -diff
          tf init -backend=false -input=false
          tf validate
      - name: Shellcheck the server, k3d and Terraform scripts
        run: docker run --rm -v "$PWD:/w" -w /w "$SHELLCHECK_IMAGE" -x -P SCRIPTDIR infra/server/*.sh infra/k3d/*.sh infra/terraform/*.sh

  images:
    if: github.event_name == 'push' && github.ref_type == 'branch'
    needs: [tests, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew bootJar
      - name: Log in to GHCR
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the five images, tagged with the commit
        run: |
          for module in $MODULES; do
            image="$IMAGE_REPOSITORY/$module:$GITHUB_SHA"
            docker build -f infra/docker/Dockerfile -t "$image" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" "$module/build/libs"
            docker push "$image"
          done

  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Add the release tag to the five images main built from this commit
        run: |
          for module in $MODULES; do
            if ! docker buildx imagetools inspect "$IMAGE_REPOSITORY/$module:$GITHUB_SHA" >/dev/null 2>&1; then
              echo "no $module image for $GITHUB_SHA: tag a commit of main once its CI run has pushed the images" >&2
              exit 1
            fi
          done
          for module in $MODULES; do
            docker buildx imagetools create -t "$IMAGE_REPOSITORY/$module:$GITHUB_REF_NAME" "$IMAGE_REPOSITORY/$module:$GITHUB_SHA"
          done
