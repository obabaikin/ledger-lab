spring:
  application:
    name: generator
  threads:
    virtual:
      enabled: true

server:
  port: 8082

generator:
  gateway-url: http://localhost:8081
  connect-timeout: 2s
  request-timeout: 5s
  max-attempts: 3
  retry-backoff: 1s
  max-in-flight: 2000
  retention: 1h
  retention-sweep-interval: 1m
  journal:
    retention: 10m
    max-entries: 300000
  profile:
    duplicate-share: 0.02
    # 0: both inserts race on the key; 50ms: accepted, no result yet; 1s: the result is in.
    duplicate-delays: 0ms, 50ms, 1s
    oversized-share: 0.005
    blocked-share: 0.005

springdoc:
  # Otherwise every controller-local error handler is added to every operation as a possible answer.
  override-with-generic-response: false

logging:
  pattern:
    correlation: "[run=%X{runId:-}] "

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
