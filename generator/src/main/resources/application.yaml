spring:
  application:
    name: generator
  lifecycle:
    # Per phase of the stop: open requests get their answers, then the journal writes what is left.
    timeout-per-shutdown-phase: 20s
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/ledgerlab?reWriteBatchedInserts=true
    username: generator
    password: generator
    hikari:
      schema: generator
      # The journal's writer and the reconciliation; the clients themselves hold no connection.
      maximum-pool-size: 6
      # Milliseconds. While the database is away no transfer is sent; a short wait tells the clients sooner.
      connection-timeout: 2000
      data-source-properties:
        # Seconds. A statement whose database froze would otherwise hold the journal's writer, and the stop, for good;
        # longer than the reconciliation's statement-timeout, which the database ends itself.
        socketTimeout: 90
  flyway:
    default-schema: generator

server:
  port: 8082

generator:
  gateway-url: http://localhost:8081
  connect-timeout: 2s
  request-timeout: 5s
  max-attempts: 3
  retry-backoff: 1s
  max-in-flight: 2000
  load:
    enabled: true
    tps: 400
    max-pulse-tps: 2000
    max-pulse: 10m
    wait-share: 0.1
    wait-timeout: 5s
    minutes-retention: 48h
    # Off: the base is tps all the time. The chart turns it on for the bank around the clock.
    profile:
      enabled: false
      seed: 1
      night-tps: 200
      day-min-tps: 300
      day-max-tps: 800
      steps: 100, 200
      step-minutes: 5
      night-start: "00:00"
      night-end: "06:00"
      time-zone: Europe/Berlin
  accounts:
    # The same as the ledger's: the clients pay between the accounts the bank has.
    count: 100000
    blocked: 100
    hot: 5
  journal:
    batch-size: 500
    # A commit per transfer would be 400 commits a second on the bank's database; a batch waits this long to gather.
    flush-interval: 20ms
  periods:
    # The same in every service: they cut time at the same instants.
    length: 60m
    # How long the journal is held after its hour ended; the bank holds its transfers as long.
    retention: 4h
    # Every connection that reads a table keeps a cache entry per partition: 313 partitions took 21 MB a connection and
    # Postgres out of its memory (k3d, 10-minute periods). Maintenance creates them every minute.
    partitions-ahead: 6h
    maintenance-interval: 1m
    lock-timeout: 2s
    # Rows left outside the partitions are deleted this many a statement: one long delete would hold up another instance's
    # partition change, and every insert queued behind it.
    unpartitioned-delete-batch: 10000
  reconciliation:
    statement-timeout: 60s
    # Per hash, times Postgres's hash_mem_multiplier (2), and a comparison holds up to two: sized for Postgres's 912Mi.
    work-mem: 32MB
    example-limit: 20
    resolve-concurrency: 16
  totals:
    read-interval: 1s
    # Up to 50 increments a second wait for the fold: about 3,000 rows to sum on a read.
    rollup-interval: 1m
  lease:
    # The pod's name, unique in the cluster.
    owner: ${HOSTNAME:generator}
    duration: 5s
    renew-every: 1s
    # How soon a new pod takes over once the old one let go.
    acquire-every: 100ms
    send-window: 3s
  profile:
    duplicate-share: 0.02
    # 0: both inserts race on the key; 50ms: accepted, no result yet; 1s: the result is in.
    duplicate-delays: 0ms, 50ms, 1s
    oversized-share: 0.005
    blocked-share: 0.005

springdoc:
  # Otherwise every controller-local error handler is added to every operation as a possible answer.
  override-with-generic-response: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
