spring:
  application:
    name: generator
  threads:
    virtual:
      enabled: true

server:
  port: 8082

generator:
  gateway-url: http://localhost:8081
  connect-timeout: 2s
  request-timeout: 5s
  max-attempts: 3
  retry-backoff: 1s
  max-in-flight: 2000
  retention: 1h
  retention-sweep-interval: 5m

logging:
  pattern:
    correlation: "[run=%X{runId:-}] "

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
