# The server's values over the chart's defaults; passwords and the host come from deploy.sh.
image:
  repository: ghcr.io/obabaikin/ledger-lab

ingress:
  tls:
    issuer: letsencrypt-prod
  securityHeaders:
    enabled: true
  rateLimit:
    enabled: true

certManager:
  enabled: true

# The server keeps up with 100 TPS; at 500 the ledger falls behind by seconds (measured on the server, LL012).
runs:
  maxTotalTps: 500
  tpsOptions: [50, 100, 300]
  defaultTps: 100
