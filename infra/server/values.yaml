# The server's values over the chart's defaults; passwords and the host come from deploy.sh.
image:
  repository: ghcr.io/obabaikin/ledger-lab

ingress:
  tls:
    issuer: letsencrypt-prod
  securityHeaders:
    enabled: true
  rateLimit:
    enabled: true

certManager:
  enabled: true

# With batched writes the node takes about 1600 TPS without a refusal and falls behind at 2000
# (docs/results/2026-11-06-optimizations.md); visitors may go up to that edge and past the limit.
runs:
  maxTotalTps: 2000
  tpsOptions: [100, 200, 300, 400, 500, 600, 700, 800, 900, 1000, 1100, 1200, 1300, 1400, 1500, 1600, 1700, 1800, 1900, 2000]
  defaultTps: 100
  # What the page's runs have opened since 2026-11-06, set by hand until now; 10,000 and 1,000,000 accounts took the
  # same load (measured on the server).
  accountCount: 1000

# A restarted gateway refused nothing from 5,000 warm-up rounds on and refused at 4,000 (measured on the server,
# docs/results/2026-10-23-server-baseline.md); one step of 1,000 above that.
services:
  gateway:
    env:
      GATEWAY_WARMUP_ROUNDS: "6000"
