# k3s applies this to its bundled Traefik. The rate limit counts requests per client address; with the default
# Cluster policy the load balancer replaces that address with the node's own.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      spec:
        externalTrafficPolicy: Local
    # Statuses and times for operation, nothing about the visitor: no client address or User-Agent, and no path,
    # query or Referer, which carry invite tokens and session ids.
    logs:
      access:
        enabled: true
        format: json
        fields:
          general:
            names:
              ClientAddr: drop
              ClientHost: drop
              ClientPort: drop
              ClientUsername: drop
              RequestPath: drop
          headers:
            defaultmode: drop
    resources:
      requests: {memory: 256Mi}
      limits: {memory: 256Mi}
