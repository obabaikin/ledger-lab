# k3s applies this to its bundled Traefik. The rate limit counts requests per client address; with the default
# Cluster policy the load balancer replaces that address with the node's own.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      spec:
        externalTrafficPolicy: Local
    # Tells browsers from bots by client address and User-Agent. The path, query and Referer stay out: they carry
    # invite tokens and session ids.
    logs:
      access:
        enabled: true
        format: json
        fields:
          general:
            names:
              RequestPath: drop
          headers:
            defaultmode: drop
            names:
              User-Agent: keep
    resources:
      requests: {memory: 256Mi}
      limits: {memory: 256Mi}
