# Services run on the host (bootRun); control reads the pods and the ledger's duplicates from here (ADR 0015),
# the pods by the label lab_service, as in the chart.
global:
  scrape_interval: 1s
  scrape_timeout: 800ms

scrape_configs:
  - job_name: ledger
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels: {lab_service: "true"}
  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]
        labels: {lab_service: "true"}
  - job_name: generator
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8082"]
        labels: {lab_service: "true"}
  - job_name: control
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8083"]
        labels: {lab_service: "true"}
  - job_name: reporting
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8084"]
        labels: {lab_service: "true"}
