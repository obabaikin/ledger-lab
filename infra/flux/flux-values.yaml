# Values of the fluxcd-community/flux2 chart (version in infra/flux/install.sh). Only the controllers a deploy needs:
# the source of the chart and the pointer, the Kustomization that applies the pointer, the HelmReleases, the events
# that mail the outcome. Images are tagged by the module's hash in the pointer, so image automation stays off.
# Memory: an estimate before the peak is measured on k3d with the bank's chart; after the first chain source took
# 53 MiB and kustomize 61 MiB.
sourceController:
  resources:
    requests: {cpu: 50m, memory: 80Mi}
    limits: {memory: 80Mi}
kustomizeController:
  resources:
    requests: {cpu: 50m, memory: 80Mi}
    limits: {memory: 80Mi}
helmController:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 64Mi}
notificationController:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 64Mi}
imageAutomationController:
  create: false
imageReflectionController:
  create: false
