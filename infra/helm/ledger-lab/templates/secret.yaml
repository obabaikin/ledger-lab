apiVersion: v1
kind: Secret
metadata:
  name: db-passwords
type: Opaque
stringData:
  {{- range $role, $password := .Values.passwords }}
  {{ $role }}: {{ $password | quote }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: control-keys
type: Opaque
stringData:
  turnstile-secret: {{ .Values.keys.turnstileSecret | quote }}
  mailjet-api-key: {{ .Values.keys.mailjetApiKey | quote }}
  mailjet-api-secret: {{ .Values.keys.mailjetApiSecret | quote }}
