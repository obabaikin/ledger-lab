{{- $root := . }}
{{- $_ := include "ledger-lab.checkNumbers" . }}
{{- $periodLength := printf "%dm" (int .Values.periodMinutes) }}
{{- $retention := printf "%dh" (int .Values.retentionHours) }}
{{- range $name, $service := .Values.services }}
{{- if include "ledger-lab.renders" (list $root $name) }}
{{- $usesKafka := has $name (list "ledger" "gateway" "reporting") }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "ledger-lab.labels" (dict "name" $name) | nindent 4 }}
spec:
  selector: {{- include "ledger-lab.labels" (dict "name" $name) | nindent 4 }}
  ports:
    - name: http
      port: {{ $service.port }}
---
apiVersion: apps/v1
kind: {{ if eq $name "ledger" }}StatefulSet{{ else }}Deployment{{ end }}
metadata:
  name: {{ $name }}
  labels: {{- include "ledger-lab.labels" (dict "name" $name) | nindent 4 }}
spec:
  {{- if eq $name "ledger" }}
  serviceName: {{ $name }}
  # Instances start together on install; the policy covers scaling only, so an update still replaces them one at a
  # time, highest first.
  podManagementPolicy: Parallel
  {{- else if $service.rollingUpdate }}
  # The new pod takes requests once it is ready; only then the old one stops.
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 1, maxUnavailable: 0}}
  {{- else }}
  # The old pod goes before the new one starts: a second pod of every service would not fit in the server's 12 GB.
  strategy: {type: Recreate}
  {{- end }}
  replicas: {{ $service.replicas }}
  selector:
    matchLabels: {{- include "ledger-lab.labels" (dict "name" $name) | nindent 6 }}
  template:
    metadata:
      labels: {{- include "ledger-lab.labels" (dict "name" $name) | nindent 8 }}
      annotations: {{- include "ledger-lab.scrape" $root | nindent 8 }}
        {{- if eq $name "control" }}
        # The keys reach control as env, read at start: a changed key restarts it.
        checksum/keys: {{ $root.Values.keys | toJson | sha256sum }}
        {{- end }}
    spec:
      # The services never call the Kubernetes API.
      automountServiceAccountToken: false
      {{- with $service.terminationGraceSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: wait-for-postgres
          image: {{ $root.Values.postgres.image }}
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432; do sleep 1; done"]
          securityContext: {{- include "ledger-lab.restricted" $root | nindent 12 }}
          resources:
            limits: {memory: {{ $root.Values.initMemory }}}
        {{- if $usesKafka }}
        - name: wait-for-topics
          image: {{ $root.Values.kafka.image }}
          command:
            - sh
            - -c
            # One topic per call: a list is read as a pattern and passes when any one of them exists.
            - for topic in transfers transfer-results; do until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe --topic "$topic" >/dev/null 2>&1; do sleep 2; done; done
          securityContext: {{- include "ledger-lab.restricted" $root | nindent 12 }}
          resources:
            limits: {memory: {{ $root.Values.kafka.toolsMemory }}}
        {{- end }}
        {{- if eq $name "generator" }}
        # The clients start once the bank takes requests: the Service lets a connection through only to a ready gateway,
        # and the gateway is ready after its warm-up. Started beside a cold gateway, they gave up on thousands of
        # transfers in the first minute of a deploy.
        - name: wait-for-gateway
          image: {{ $root.Values.postgres.image }}
          command: ["sh", "-c", "until nc -z -w 2 gateway {{ $root.Values.services.gateway.port }}; do sleep 2; done"]
          securityContext: {{- include "ledger-lab.restricted" $root | nindent 12 }}
          resources:
            limits: {memory: {{ $root.Values.initMemory }}}
        {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "ledger-lab.image" (dict "root" $root "service" $service) }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            {{- include "ledger-lab.restricted" $root | nindent 12 }}
          env:
            - {name: SERVER_PORT, value: {{ $service.port | quote }}}
            - {name: MANAGEMENT_SERVER_PORT, value: {{ $root.Values.managementPort | quote }}}
            - {name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://postgres:5432/ledgerlab?reWriteBatchedInserts=true"}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: {name: db-passwords, key: {{ $name }}}
            {{- if eq $name "control" }}
            - {name: CONTROL_PERIODS_LENGTH, value: {{ $periodLength | quote }}}
            - {name: CONTROL_PERIODS_DETAILSRETENTION, value: {{ $retention | quote }}}
            - {name: CONTROL_PERIODS_SETTLEDELAY, value: {{ $root.Values.closing.settleDelay | quote }}}
            - {name: CONTROL_PERIODS_CHECKWAIT, value: {{ $root.Values.closing.checkWait | quote }}}
            - {name: CONTROL_PERIODS_RETRYWAIT, value: {{ $root.Values.closing.retryWait | quote }}}
            - {name: CONTROL_PERIODS_VERDICTDEADLINE, value: {{ $root.Values.closing.verdictDeadline | quote }}}
            {{- else }}
            - {name: {{ upper $name }}_PERIODS_LENGTH, value: {{ $periodLength | quote }}}
            - {name: {{ upper $name }}_PERIODS_RETENTION, value: {{ $retention | quote }}}
            {{- end }}
            {{- if $usesKafka }}
            - {name: SPRING_KAFKA_BOOTSTRAPSERVERS, value: "kafka:9092"}
            {{- end }}
            {{- if eq $name "ledger" }}
            {{- if mod $root.Values.kafka.partitions $service.replicas }}
            {{- fail "kafka.partitions must divide evenly among the ledger's replicas" }}
            {{- end }}
            # Consumers beyond one per partition would get none.
            - {name: SPRING_KAFKA_LISTENER_CONCURRENCY, value: {{ div $root.Values.kafka.partitions $service.replicas | quote }}}
            - {name: LEDGER_CHAOS_ENABLED, value: {{ $root.Values.chaos | quote }}}
            - {name: LEDGER_ACCOUNTS_COUNT, value: {{ int64 $root.Values.accounts.count | quote }}}
            # The hot accounts' surplus goes to the pool once a period.
            - {name: LEDGER_POOL_HOTSWEEPINTERVAL, value: {{ $periodLength | quote }}}
            {{- end }}
            {{- if eq $name "gateway" }}
            - {name: GATEWAY_LATENCY_SLOTHRESHOLDS, value: "{{ $root.Values.slo.posting.typical.threshold }},{{ $root.Values.slo.posting.tail.threshold }}"}
            {{- end }}
            {{- if eq $name "generator" }}
            - {name: GENERATOR_GATEWAYURL, value: "http://gateway:{{ $root.Values.services.gateway.port }}"}
            - {name: GENERATOR_ACCOUNTS_COUNT, value: {{ int64 $root.Values.accounts.count | quote }}}
            - {name: GENERATOR_LOAD_TPS, value: {{ int64 $root.Values.load.baseTps | quote }}}
            - {name: GENERATOR_LOAD_MAXPULSETPS, value: {{ int64 $root.Values.load.maxTps | quote }}}
            {{- with $root.Values.load.profile }}
            - {name: GENERATOR_LOAD_PROFILE_ENABLED, value: {{ .enabled | quote }}}
            - {name: GENERATOR_LOAD_PROFILE_SEED, value: {{ int64 .seed | quote }}}
            - {name: GENERATOR_LOAD_PROFILE_NIGHTTPS, value: {{ int64 .nightTps | quote }}}
            - {name: GENERATOR_LOAD_PROFILE_DAYMINTPS, value: {{ int64 .dayMinTps | quote }}}
            - {name: GENERATOR_LOAD_PROFILE_DAYMAXTPS, value: {{ int64 .dayMaxTps | quote }}}
            - {name: GENERATOR_LOAD_PROFILE_STEPS, value: {{ join "," .steps | quote }}}
            - {name: GENERATOR_LOAD_PROFILE_STEPMINUTES, value: {{ int64 .stepMinutes | quote }}}
            - {name: GENERATOR_LOAD_PROFILE_NIGHTSTART, value: {{ .nightStart | quote }}}
            - {name: GENERATOR_LOAD_PROFILE_NIGHTEND, value: {{ .nightEnd | quote }}}
            - {name: GENERATOR_LOAD_PROFILE_TIMEZONE, value: {{ .timeZone | quote }}}
            {{- end }}
            {{- end }}
            {{- if eq $name "control" }}
            {{- range $other := list "ledger" "gateway" "generator" "reporting" }}
            - {name: CONTROL_{{ upper $other }}_BASEURL, value: "http://{{ $other }}:{{ (get $root.Values.services $other).port }}"}
            {{- end }}
            - {name: CONTROL_PROMETHEUS_BASEURL, value: "http://prometheus:9090"}
            - {name: CONTROL_CHAOS_ENABLED, value: {{ $root.Values.chaos | quote }}}
            - {name: CONTROL_LOAD_MINTPS, value: {{ int64 $root.Values.load.minPulseTps | quote }}}
            - {name: CONTROL_LOAD_MAXTPS, value: {{ int64 $root.Values.load.maxTps | quote }}}
            - {name: CONTROL_LOAD_TPSSTEP, value: {{ int64 $root.Values.load.tpsStep | quote }}}
            - {name: CONTROL_LOAD_DEFAULTTPS, value: {{ int64 $root.Values.load.defaultPulseTps | quote }}}
            # Read back by infra/server/maintenance.sh, which tells whether a window is declared in time.
            - {name: CONTROL_MAINTENANCE_NOTICE, value: "{{ int $root.Values.maintenance.noticeHours }}h"}
            {{- range $name, $target := $root.Values.slo.posting }}
            - {name: CONTROL_POSTING_{{ upper $name }}_THRESHOLD, value: {{ $target.threshold | quote }}}
            - {name: CONTROL_POSTING_{{ upper $name }}_TARGET, value: {{ $target.target | quote }}}
            {{- end }}
            - {name: CONTROL_SITE_VERSION, value: {{ $root.Values.version | quote }}}
            {{- with $root.Values.ingress.host }}
            - {name: CONTROL_SITE_BASEURL, value: "https://{{ . }}"}
            {{- end }}
            - {name: CONTROL_TURNSTILE_SITEKEY, value: {{ $root.Values.invites.turnstileSiteKey | quote }}}
            {{- with $root.Values.invites.mailFrom }}
            - {name: CONTROL_MAIL_FROM, value: {{ . | quote }}}
            {{- end }}
            - {name: CONTROL_SITE_OPERATORNAME, value: {{ $root.Values.invites.operator.name | quote }}}
            - {name: CONTROL_SITE_OPERATORADDRESS, value: {{ $root.Values.invites.operator.address | quote }}}
            - {name: CONTROL_SITE_CONTACTEMAIL, value: {{ $root.Values.invites.operator.email | quote }}}
            {{- range $variable, $key := dict "CONTROL_TURNSTILE_SECRET" "turnstile-secret" "CONTROL_MAIL_APIKEY" "mailjet-api-key" "CONTROL_MAIL_APISECRET" "mailjet-api-secret" }}
            - name: {{ $variable }}
              valueFrom:
                secretKeyRef: {name: control-keys, key: {{ $key }}}
            {{- end }}
            {{- range $i := until (int $root.Values.services.ledger.replicas) }}
            - {name: CONTROL_CHAOS_LEDGERINSTANCES_{{ $i }}_NAME, value: "ledger-{{ $i }}"}
            - {name: CONTROL_CHAOS_LEDGERINSTANCES_{{ $i }}_URL, value: "http://ledger-{{ $i }}.ledger:{{ $root.Values.managementPort }}"}
            {{- end }}
            {{- end }}
            {{- with $service.nativeReserve }}
            {{- if not (and (hasSuffix "Mi" $service.memory) (hasSuffix "Mi" .)) }}
            {{- fail (printf "services.%s.memory and nativeReserve must be in Mi" $name) }}
            {{- end }}
            {{- $heap := sub (trimSuffix "Mi" $service.memory | int) (trimSuffix "Mi" . | int) }}
            {{- if le $heap 0 }}
            {{- fail (printf "services.%s.nativeReserve leaves no heap" $name) }}
            {{- end }}
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms{{ $heap }}m -Xmx{{ $heap }}m {{ $service.jvmOptions }}"
            {{- end }}
            {{- range $key, $value := $service.env }}
            - {name: {{ $key }}, value: {{ $value | quote }}}
            {{- end }}
          {{- with $service.preStopSeconds }}
          lifecycle:
            preStop:
              sleep: {seconds: {{ . }}}
          {{- end }}
          ports:
            - {name: http, containerPort: {{ $service.port }}}
            - {name: management, containerPort: {{ $root.Values.managementPort }}}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: management}
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: management}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: management}
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests: {memory: {{ $service.memory }}}
            limits: {memory: {{ $service.memory }}}
          {{- with $service.dumps }}
          volumeMounts:
            - {name: dumps, mountPath: /dumps}
      volumes:
        - name: dumps
          emptyDir: {sizeLimit: {{ . }}}
          {{- end }}
{{- end }}
{{- end }}
