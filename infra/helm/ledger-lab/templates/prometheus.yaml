apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: {{ .Release.Namespace }}
---
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels: {{- include "ledger-lab.labels" (dict "name" "prometheus") | nindent 4 }}
spec:
  selector: {{- include "ledger-lab.labels" (dict "name" "prometheus") | nindent 4 }}
  ports:
    - port: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels: {{- include "ledger-lab.labels" (dict "name" "prometheus") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "ledger-lab.labels" (dict "name" "prometheus") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "ledger-lab.labels" (dict "name" "prometheus") | nindent 8 }}
      annotations:
        # Prometheus reads its config only at start; a changed config has to restart the pod.
        checksum/config: {{ include (print $.Template.BasePath "/prometheus-config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: {{ .Values.prometheus.image }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time=1d
          ports:
            - containerPort: 9090
          readinessProbe:
            httpGet: {path: /-/ready, port: 9090}
          resources:
            requests: {memory: {{ .Values.prometheus.memory }}}
            limits: {memory: {{ .Values.prometheus.memory }}}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
      volumes:
        - name: config
          configMap: {name: prometheus}
