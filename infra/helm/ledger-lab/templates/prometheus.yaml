apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: {{ .Release.Namespace }}
---
# The kubelet's resource metrics, read from the node itself; nodes/proxy is not needed for them.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-prometheus-kubelet
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-prometheus-kubelet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-prometheus-kubelet
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: {{ .Release.Namespace }}
---
# The charts of the last days outlive a restart of the pod.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  labels: {{- include "ledger-lab.labels" (dict "name" "prometheus") | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests: {storage: {{ .Values.prometheus.storage }}}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels: {{- include "ledger-lab.labels" (dict "name" "prometheus") | nindent 4 }}
spec:
  selector: {{- include "ledger-lab.labels" (dict "name" "prometheus") | nindent 4 }}
  ports:
    - port: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels: {{- include "ledger-lab.labels" (dict "name" "prometheus") | nindent 4 }}
spec:
  replicas: 1
  # As the services: old and new together would not fit in the server's 12 GB.
  strategy: {type: Recreate}
  selector:
    matchLabels: {{- include "ledger-lab.labels" (dict "name" "prometheus") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "ledger-lab.labels" (dict "name" "prometheus") | nindent 8 }}
      annotations:
        # Prometheus reads its config only at start; a changed config has to restart the pod.
        checksum/config: {{ include (print $.Template.BasePath "/prometheus-config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: {{ .Values.prometheus.image }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ .Values.prometheus.retention }}
            - --storage.tsdb.retention.size={{ .Values.prometheus.retentionSize }}
          ports:
            - containerPort: 9090
          readinessProbe:
            httpGet: {path: /-/ready, port: 9090}
          resources:
            requests: {memory: {{ .Values.prometheus.memory }}}
            limits: {memory: {{ .Values.prometheus.memory }}}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap: {name: prometheus}
        - name: data
          persistentVolumeClaim: {claimName: prometheus-data}
