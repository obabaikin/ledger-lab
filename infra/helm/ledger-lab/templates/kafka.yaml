{{- $_ := include "ledger-lab.checkNumbers" . }}
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels: {{- include "ledger-lab.labels" (dict "name" "kafka") | nindent 4 }}
spec:
  selector: {{- include "ledger-lab.labels" (dict "name" "kafka") | nindent 4 }}
  ports:
    - port: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels: {{- include "ledger-lab.labels" (dict "name" "kafka") | nindent 4 }}
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels: {{- include "ledger-lab.labels" (dict "name" "kafka") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "ledger-lab.labels" (dict "name" "kafka") | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: kafka
          image: {{ .Values.kafka.image }}
          # Any KAFKA_* variable replaces the image's default config, so the full single-node setup is listed.
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false"}
            - {name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data}
            - {name: KAFKA_HEAP_OPTS, value: "-Xmx{{ .Values.kafka.heap }} -Xms{{ .Values.kafka.heap }}"}
          ports:
            - containerPort: 9092
          readinessProbe:
            tcpSocket: {port: 9092}
            periodSeconds: 2
          resources:
            requests: {memory: {{ .Values.kafka.memory }}}
            limits: {memory: {{ .Values.kafka.memory }}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/kafka/data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: {storage: {{ .Values.kafka.storage }}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: create-topics
data:
  create-topics.sh: {{ .Files.Get "files/create-topics.sh" | quote }}
---
# Created again only when its spec or the script change, so every change of the topics is checked.
{{ include "ledger-lab.setupJob" (dict "name" "create-topics" "spec" (include "ledger-lab.createTopicsSpec" .) "inputs" (.Files.Get "files/create-topics.sh")) }}
{{- define "ledger-lab.createTopicsSpec" -}}
backoffLimit: 10
template:
  spec:
    restartPolicy: OnFailure
    containers:
      - name: create-topics
        image: {{ .Values.kafka.image }}
        command: ["/bin/sh", "/scripts/create-topics.sh"]
        env:
          - {name: KAFKA_BOOTSTRAP, value: "kafka:9092"}
          - {name: KAFKA_WAIT_SECONDS, value: {{ include "ledger-lab.whole" (list "setupWaitSeconds" .Values.setupWaitSeconds false) | quote }}}
          - {name: KAFKA_PARTITIONS, value: {{ .Values.kafka.partitions | quote }}}
          - {name: KAFKA_RETENTION_MS, value: {{ mul (int64 .Values.retentionHours) 3600000 | quote }}}
          - {name: KAFKA_RETENTION_BYTES, value: {{ int64 .Values.kafka.retentionBytesPerPartition | quote }}}
        resources:
          limits: {memory: {{ .Values.kafka.toolsMemory }}}
        volumeMounts:
          - {name: scripts, mountPath: /scripts}
    volumes:
      - name: scripts
        configMap: {name: create-topics}
{{- end }}
