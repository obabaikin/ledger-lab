apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus
data:
  prometheus.yml: |
    # Control reads the pods and the ledger's duplicates from here (ADR 0015): job is the service, instance the pod.
    global:
      scrape_interval: 1s
      scrape_timeout: 800ms
    scrape_configs:
      - job_name: pods
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [{{ .Release.Namespace }}]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            regex: "true"
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_init]
            regex: "true"
            action: drop
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: management
            action: keep
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            target_label: __metrics_path__
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: job
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: instance
          # Control lists the project's own services by this label (the bank, the generator, control); the exporters and
          # cert-manager are not among them.
          - target_label: lab_service
            replacement: "true"
      - job_name: exporters
        scrape_interval: {{ .Values.exporters.scrapeInterval }}
        scrape_timeout: {{ .Values.exporters.scrapeTimeout }}
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [{{ .Release.Namespace }}]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            regex: "true"
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: metrics
            action: keep
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: job
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: instance
      {{- if .Values.certManager.enabled }}
      - job_name: cert-manager
        scrape_interval: 1m
        static_configs:
          - targets: [{{ .Values.certManager.metricsTarget | quote }}]
    rule_files: [/etc/prometheus/rules.yml]
  rules.yml: |
    groups:
      - name: certificates
        rules:
          # No Alertmanager: the alert shows on Prometheus' /alerts page.
          - alert: CertificateExpiresSoon
            expr: certmanager_certificate_expiration_timestamp_seconds - time() < {{ .Values.certManager.expiryAlertDays }} * 24 * 3600
            labels:
              severity: warning
            annotations:
              summary: "Certificate {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.name {{ "}}" }} expires in less than {{ .Values.certManager.expiryAlertDays }} days"
      {{- end }}
