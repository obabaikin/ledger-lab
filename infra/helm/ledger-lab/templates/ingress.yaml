{{- $middlewares := list }}
{{- if .Values.ingress.tls.issuer }}
{{- $middlewares = append $middlewares (printf "%s-redirect-to-https@kubernetescrd" .Release.Namespace) }}
{{- end }}
{{- if .Values.ingress.rateLimit.enabled }}
{{- $middlewares = append $middlewares (printf "%s-rate-limit@kubernetescrd" .Release.Namespace) }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: control
  {{- if or .Values.ingress.tls.issuer $middlewares }}
  annotations:
    {{- if .Values.ingress.tls.issuer }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.issuer }}
    {{- end }}
    {{- if $middlewares }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ join "," $middlewares }}
    {{- end }}
  {{- end }}
spec:
  {{- if .Values.ingress.tls.issuer }}
  {{- if not .Values.ingress.host }}
  {{- fail "ingress.tls.issuer needs ingress.host" }}
  {{- end }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: control
                port: {name: http}
      {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
{{- if .Values.ingress.tls.issuer }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
{{- end }}
{{- if .Values.ingress.rateLimit.enabled }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit
spec:
  rateLimit:
    average: {{ .Values.ingress.rateLimit.average }}
    burst: {{ .Values.ingress.rateLimit.burst }}
{{- end }}
