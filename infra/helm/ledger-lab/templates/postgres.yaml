apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  init.sh: |
    #!/bin/sh
    set -eu
    for role in ledger gateway control reporting; do
      password=$(cat "/run/db-passwords/$role")
      psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
        -v role="$role" -v password="$password" <<'SQL'
    CREATE ROLE :"role" LOGIN PASSWORD :'password';
    CREATE SCHEMA :"role" AUTHORIZATION :"role";
    SQL
    done
    psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c 'REVOKE ALL ON SCHEMA public FROM PUBLIC'
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: {{- include "ledger-lab.labels" (dict "name" "postgres") | nindent 4 }}
spec:
  selector: {{- include "ledger-lab.labels" (dict "name" "postgres") | nindent 4 }}
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: {{- include "ledger-lab.labels" (dict "name" "postgres") | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {{- include "ledger-lab.labels" (dict "name" "postgres") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "ledger-lab.labels" (dict "name" "postgres") | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          args: ["-c", "shared_buffers={{ .Values.postgres.sharedBuffers }}"]
          env:
            - name: POSTGRES_DB
              value: ledgerlab
            - name: POSTGRES_USER
              value: admin
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: db-passwords, key: postgres}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "admin", "-d", "ledgerlab"]
            periodSeconds: 2
          resources:
            requests: {memory: {{ .Values.postgres.memory }}}
            limits: {memory: {{ .Values.postgres.memory }}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d}
            - {name: passwords, mountPath: /run/db-passwords, readOnly: true}
      volumes:
        - name: init
          configMap: {name: postgres-init, defaultMode: 0555}
        - name: passwords
          secret: {secretName: db-passwords}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: {storage: {{ .Values.postgres.storage }}}
---
# A new name per release revision, as create-topics: the init script above runs only on an empty volume, so a role
# added later is created here, on the database that already exists.
apiVersion: batch/v1
kind: Job
metadata:
  name: monitor-role-{{ .Release.Revision }}
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The postgres user of the Alpine image.
        runAsUser: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: monitor-role
          image: {{ .Values.postgres.image }}
          command:
            - sh
            - -c
            - |
              set -eu
              psql -v ON_ERROR_STOP=1 -h postgres -U admin -d ledgerlab -v password="$(cat /run/db-passwords/monitor)" <<'SQL'
              SELECT 'CREATE ROLE monitor' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'monitor') \gexec
              ALTER ROLE monitor WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD :'password';
              GRANT pg_monitor TO monitor;
              SQL
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: db-passwords, key: postgres}
          securityContext: {{- include "ledger-lab.restricted" . | nindent 12 }}
          resources:
            limits: {memory: {{ .Values.initMemory }}}
          volumeMounts:
            - {name: passwords, mountPath: /run/db-passwords, readOnly: true}
      volumes:
        - name: passwords
          secret: {secretName: db-passwords, items: [{key: monitor, path: monitor}]}
