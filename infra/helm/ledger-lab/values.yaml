# Local k3d defaults. Real passwords come from --set or a values file outside the repository.
image:
  repository: ledger-lab
  tag: dev
  pullPolicy: IfNotPresent

managementPort: 9000
chaos: true
initMemory: 64Mi

# Roles are created only on an empty volume: a password changed here later also needs ALTER ROLE by hand in Postgres.
passwords:
  postgres: change-me-postgres
  ledger: change-me-ledger
  gateway: change-me-gateway
  control: change-me-control
  reporting: change-me-reporting

kafka:
  image: apache/kafka:4.2.1
  partitions: 6
  storage: 2Gi
  heap: 768m
  memory: 1268Mi
  toolsMemory: 512Mi

postgres:
  image: postgres:17-alpine
  storage: 2Gi
  memory: 512Mi

prometheus:
  image: prom/prometheus:v3.5.0
  memory: 512Mi

# Off in k3d: the server sets a host, a Let's Encrypt issuer, security headers and the rate limit (infra/server/values.yaml).
ingress:
  host: ""
  tls:
    issuer: ""
    secretName: control-tls
  securityHeaders:
    enabled: false
    hstsSeconds: 31536000
  rateLimit:
    enabled: false
    average: 20
    burst: 50

# cert-manager is installed beside the chart by infra/server/deploy.sh; this adds its issuers, scrape and alert.
certManager:
  enabled: false
  metricsTarget: cert-manager.cert-manager.svc:9402
  expiryAlertDays: 14

services:
  ledger:
    module: ledger-service
    port: 8080
    replicas: 3
    memory: 512Mi
  gateway:
    module: gateway
    port: 8081
    replicas: 1
    memory: 1068Mi
  generator:
    module: generator
    port: 8082
    replicas: 1
    memory: 576Mi
  control:
    module: control
    port: 8083
    replicas: 1
    memory: 448Mi
  reporting:
    module: reporting
    port: 8084
    replicas: 1
    memory: 448Mi

runs:
  # Transfers per second of all active runs together; 1000 from measurements in k3d (ADR 0012).
  maxTotalTps: 1000
  # Empty: control's own options and default (control/src/main/resources/application.yaml).
  tpsOptions: []
  defaultTps: null
