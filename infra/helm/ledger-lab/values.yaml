# Local k3d defaults. Real passwords come from --set or a values file outside the repository.
image:
  repository: ledger-lab
  tag: dev
  pullPolicy: IfNotPresent

# Shown on the page; the deploy scripts set it, the image carries none (built once, deployed under any tag).
version: dev

managementPort: 9000
chaos: true
initMemory: 64Mi

# The services' roles are created only on an empty volume: a password changed here later also needs ALTER ROLE by hand
# in Postgres. The monitor role is created or updated on every install and upgrade.
passwords:
  postgres: change-me-postgres
  ledger: change-me-ledger
  gateway: change-me-gateway
  control: change-me-control
  reporting: change-me-reporting
  monitor: change-me-monitor

kafka:
  image: apache/kafka:4.2.1
  partitions: 6
  storage: 2Gi
  heap: 768m
  memory: 1268Mi
  toolsMemory: 512Mi

postgres:
  image: postgres:17-alpine
  storage: 2Gi
  # The peak of the server's series was 729Mi of 768Mi; a quarter above it (docs/results/2026-10-23-server-baseline.md).
  memory: 912Mi
  # The indexes of a run are written in random order, so they must stay cached.
  sharedBuffers: 384MB
  # The services' pools take 94 (gateway 40, ledger 2 x 10, control 10, reporting 10, the exporter and the operator);
  # while the gateway is replaced, its old and new pod hold their pools at once.
  maxConnections: 150

prometheus:
  image: prom/prometheus:v3.5.0
  memory: 512Mi

# Outside the bank's work path: they only feed Prometheus, and nothing waits for them.
exporters:
  scrapeInterval: 5s
  scrapeTimeout: 4s
  node:
    image: quay.io/prometheus/node-exporter:v1.12.1
    port: 9100
    memory: 64Mi
  postgres:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    port: 9187
    memory: 64Mi

# Off in k3d: the server sets a host, a Let's Encrypt issuer, security headers and the rate limit (infra/server/values.yaml).
ingress:
  host: ""
  tls:
    issuer: ""
    secretName: control-tls
  securityHeaders:
    enabled: false
    hstsSeconds: 31536000
  rateLimit:
    enabled: false
    average: 20
    burst: 50

# cert-manager is installed beside the chart by infra/server/deploy.sh; this adds its issuers, scrape and alert.
certManager:
  enabled: false
  metricsTarget: cert-manager.cert-manager.svc:9402
  expiryAlertDays: 14

services:
  ledger:
    module: ledger-service
    port: 8080
    # Two: a third added no throughput, the ledger waits on row locks in Postgres, not on its own CPU (about
    # 120m per pod at 1300 TPS, measured on the server), and its memory is needed while the gateway is replaced.
    replicas: 2
    # A batch of 100 transfers per consumer, three consumers per pod.
    memory: 750Mi
  gateway:
    module: gateway
    port: 8081
    # One: a second on the same node took about a core from the ledger and Postgres and added no throughput
    # (docs/adr/0020-gateway-deploys-without-downtime.md). A deploy starts the new pod before the old one stops.
    replicas: 1
    rollingUpdate: true
    # Longer than a wait for a result (gateway.max-wait), the pause and the drain together.
    terminationGraceSeconds: 30
    # The Service stops sending to the old pod before it stops taking requests.
    preStopSeconds: 5
    memory: 1568Mi
    # The template sets the heap to the memory less this, fixed from the start: outside the heap the JVM took 330 to
    # 367 MiB whatever the load, more with a larger heap (metaspace, JIT code, G1's structures, threads; measured on
    # the server), and a heap of a share of the memory left 1024Mi pods 25 MiB of it, so the kernel killed them. A
    # heap that grows again after a quiet hour slowed the first requests (measured on the server).
    nativeReserve: 500Mi
    # Replaces the image's options whole, so it repeats what the gateway needs of them. The JIT keeps its code
    # through a quiet hour as well.
    jvmOptions: -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/dumps -XX:-UseCodeCacheFlushing -Xlog:gc,gc+cpu:stdout:time,level,tags
    # An OutOfMemoryError leaves its heap dump here; it lives as long as the pod.
    dumps: 2Gi
    env:
      SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE: "40"
      # 200 waiting for the batch writers met 503 busy at 300 TPS on the server; 1000 took 2000 TPS without them.
      GATEWAY_ADMISSION_MAXCONCURRENT: "1000"
  generator:
    module: generator
    port: 8082
    replicas: 1
    # The bank's clients; the journals of a run stay on the heap until it is reconciled, at most 179 MiB live at
    # 279,000 entries (measured on the server).
    memory: 1280Mi
    # As the gateway's: about 330 MiB outside the heap (measured), the heap fixed from the start.
    nativeReserve: 450Mi
    jvmOptions: -Xlog:gc,gc+cpu:stdout:time,level,tags
  control:
    module: control
    port: 8083
    replicas: 1
    memory: 448Mi
  reporting:
    module: reporting
    port: 8084
    replicas: 1
    memory: 448Mi

# Mailed invites (ADR 0017). Empty in k3d: no Turnstile check, every mail logged as not sent, no operator on the
# imprint. On the server deploy.sh fills them from ~/.config/ledger-lab/server.env and refuses to deploy without them.
invites:
  turnstileSiteKey: ""
  mailFrom: ""
  operator:
    name: ""
    address: ""
    email: ""
keys:
  turnstileSecret: ""
  mailjetApiKey: ""
  mailjetApiSecret: ""

runs:
  # Transfers per second of all active runs together (ADR 0012); 2000 since batched writes (ADR 0019).
  maxTotalTps: 2000
  # Empty: control's own options and default (control/src/main/resources/application.yaml).
  tpsOptions: []
  defaultTps: null
