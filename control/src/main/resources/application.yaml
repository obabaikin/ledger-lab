spring:
  application:
    name: control
  messages:
    basename: i18n/mail
    fallback-to-system-locale: false
    always-use-message-format: true
  threads:
    virtual:
      enabled: true
  # A cached index keeps an old page after a deploy (ADR 0014).
  web:
    resources:
      cache:
        use-last-modified: false
        cachecontrol:
          no-cache: true
  datasource:
    url: jdbc:postgresql://localhost:5432/ledgerlab
    username: control
    password: control
    hikari:
      schema: control
  flyway:
    default-schema: control

server:
  port: 8083

control:
  runs:
    max-active: 3
    max-queued: 10
    # From measurements in k3d (ADR 0012).
    max-total-tps: 1000
    # A start holds a connection of the pool of 10 while it waits for the queue's lock; the rest stay for reads and the tick.
    max-concurrent-starts: 4
    start-wait: 200ms
    queue-timeout: 5m
    tps-options: 100, 500, 1000
    default-tps: 1000
    duration-options: 10s, 20s, 30s
    setup-timeout: 30s
    running-grace: 60s
    drain-stall-timeout: 60s
    drain-timeout: 3m
    accounts:
      count: 100
      # 10 000 EUR ran out after about 17 minutes at 300 TPS (measured): most payments go to five merchants.
      # 1 000 000 EUR lasts many such runs; an account sends about 110 000 EUR an hour, the daily limit is twice that.
      opening-balance-cents: 100000000
      blocked: 2
      daily-limit-cents: 20000000
  queue:
    poll-interval: 1s
  ledger:
    base-url: http://localhost:8080
    # The transfers topic's partition count (infra/kafka/create-topics.sh); runs start once the ledger holds them all.
    transfer-partitions: 6
    # It reads the whole run: longer than a plain request, and grows with the run's size.
    reconciliation-timeout: 30s
  gateway:
    base-url: http://localhost:8081
    # Like the ledger's reconciliation: it reads the whole run.
    summary-timeout: 30s
  generator:
    base-url: http://localhost:8082
    reconciliation-timeout: 30s
  services:
    request-timeout: 5s
  cleanup:
    interval: 1h
    retention: 24h
  reporting:
    base-url: http://localhost:8084
    # Past Kafka's session timeout (45 s): a killed reporting instance's partitions move to another by then (ADR 0015).
    catch-up-wait: 60s
    # The live chart reads the stats every tick within the services' timeout; the report's read covers the whole run.
    final-stats-timeout: 30s
  prometheus:
    base-url: http://localhost:9090
    # Shorter than the services': it is read every tick for every live run.
    request-timeout: 1s
  chaos:
    # On in the chart, which also lists the ledger instances by their management URLs.
    enabled: false
    min-interval: 60s
    request-timeout: 2s
  invites:
    email:
      links-per-address: 3
      # Every mail counts, the limit notices too.
      daily-mails: 50
      window: 24h
      lifetime: 7d
      runs-per-hour: 10
      retention: 30d
      deletion-check: 1m
  turnstile:
    site-key: ""
    secret: ""
    base-url: https://challenges.cloudflare.com
    request-timeout: 5s
  mail:
    base-url: https://api.mailjet.com
    api-key: ""
    api-secret: ""
    from: no-reply@localhost
    send-interval: 5s
    batch-size: 10
    max-attempts: 5
    # Doubles with each attempt: 1, 2, 4 and 8 minutes.
    first-retry: 1m
    request-timeout: 10s
    time-zone: Europe/Berlin
  site:
    base-url: http://localhost:8083
    operator-name: ""
    operator-address: ""
    contact-email: ""

springdoc:
  # Each endpoint lists its own answers; otherwise every error handler is added to every operation.
  override-with-generic-response: false
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
