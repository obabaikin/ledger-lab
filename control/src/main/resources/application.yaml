spring:
  application:
    name: control
  messages:
    basename: i18n/mail
    fallback-to-system-locale: false
    always-use-message-format: true
  threads:
    virtual:
      enabled: true
  # A cached index keeps an old page after a deploy (ADR 0014).
  web:
    resources:
      cache:
        use-last-modified: false
        cachecontrol:
          no-cache: true
  datasource:
    url: jdbc:postgresql://localhost:5432/ledgerlab
    username: control
    password: control
    hikari:
      schema: control
  flyway:
    default-schema: control

server:
  port: 8083

control:
  periods:
    # The bank's period: the same value as in the gateway, ledger, reporting and generator.
    length: 60m
    # The gateway closes a period only once no transfer accepted in it is still being written.
    close-delay: 60s
    tick-interval: 1s
    # From the period's end: the bank's counts of a period are read once, when its transfers are long written.
    settle-delay: 10m
    # From the request: the ledger's check and the clients' reconciliation take minutes on a full period.
    check-wait: 5m
    # Counts that do not agree yet and a check or reconciliation not there yet are asked about again after this.
    retry-wait: 5m
    # From the period's end: without a verdict by then the period fails with the reason.
    verdict-deadline: 40m
    # The bank's retention of transfers: the same value as in its services.
    details-retention: 4h
    # The counts read the whole period: the gateway's took up to 5.6 s on the server (Prometheus, 2026-11-14), over
    # services.request-timeout, and a count not answered in time is made again only after retry-wait.
    count-timeout: 30s
  bank:
    books-interval: 1m
    recent-chaos: 2h
  availability:
    poll-interval: 15s
    good-minute-answered-percent: 99
    minutes-retention: 48h
    slo-target: 0.999
    slo-window: 30d
  freshness:
    # The same value as the gateway's gateway.latency.slo-threshold: its histogram has a bucket at it.
    threshold: 2s
    bad-share-percent: 1
    # Prometheus has a minute's last samples a scrape after its end; the margin covers a late scrape.
    lag: 30s
    catch-up: 1h
    slo-target: 0.999
  outside:
    # Pulses up to this speed are promised and judged; above it the clients test the bank past its limits (docs/guides/slo.md).
    guaranteed-tps: 1300
    chaos-aftermath: 60s
    load-aftermath: 30s
    restart-margin: 60s
  maintenance:
    notice: 3h
  series:
    # Prometheus scrapes the pods every second; each window holds at least 15 scrapes.
    ranges:
      - {range: 5m, step: 5s, window: 15s}
      - {range: 30m, step: 15s, window: 30s}
      - {range: 2h, step: 30s, window: 1m}
    default-range: 2h
    # Every visitor's page asks for the same charts.
    cache: 15s
  ledger:
    base-url: http://localhost:8080
  gateway:
    base-url: http://localhost:8081
  generator:
    base-url: http://localhost:8082
  services:
    request-timeout: 5s
  cleanup:
    interval: 1h
    retention: 48h
  reporting:
    base-url: http://localhost:8084
    # Past Kafka's session timeout (45 s): a killed reporting instance's partitions move to another by then (ADR 0015).
    catch-up-wait: 60s
  prometheus:
    base-url: http://localhost:9090
    # Shorter than the services': it is read every tick.
    request-timeout: 1s
  chaos:
    # On in the chart, which also lists the ledger instances by their management URLs.
    enabled: false
    min-interval: 90s
    request-timeout: 2s
  load:
    # The bank's speed while a visitor's pulse lasts; its base (400) is the lowest option.
    min-tps: 400
    max-tps: 2000
    tps-step: 100
    default-tps: 1000
    duration-options: 10s, 20s, 30s
    default-duration: 10s
    min-interval: 60s
  invites:
    email:
      links-per-address: 3
      # Every mail counts, the limit notices too.
      daily-mails: 50
      window: 24h
      lifetime: 7d
      retention: 30d
      deletion-check: 1m
  turnstile:
    site-key: ""
    secret: ""
    base-url: https://challenges.cloudflare.com
    request-timeout: 5s
  mail:
    base-url: https://api.mailjet.com
    api-key: ""
    api-secret: ""
    from: no-reply@localhost
    send-interval: 5s
    batch-size: 10
    max-attempts: 5
    # Doubles with each attempt: 1, 2, 4 and 8 minutes.
    first-retry: 1m
    request-timeout: 10s
    time-zone: Europe/Berlin
  site:
    base-url: http://localhost:8083
    operator-name: ""
    operator-address: ""
    contact-email: ""
    # The deployment names the version it runs (infra/k3d/up.sh, infra/server/deploy.sh); the image carries none.
    version: dev

springdoc:
  # Each endpoint lists its own answers; otherwise every error handler is added to every operation.
  override-with-generic-response: false
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
