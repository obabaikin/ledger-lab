spring:
  application:
    name: control
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/ledgerlab
    username: control
    password: control
    hikari:
      schema: control
  flyway:
    default-schema: control

server:
  port: 8083

control:
  runs:
    max-active: 3
    max-queued: 10
    queue-timeout: 5m
    tps-options: 100, 500, 1000
    duration-options: 10s, 20s, 30s
    setup-timeout: 30s
    running-grace: 60s
    drain-stall-timeout: 60s
    drain-timeout: 3m
    accounts:
      count: 100
      opening-balance-cents: 1000000
      blocked: 2
      daily-limit-cents: 5000000
  queue:
    poll-interval: 1s
  ledger:
    base-url: http://localhost:8080
    readiness-timeout: 2s
  gateway:
    base-url: http://localhost:8081
  generator:
    base-url: http://localhost:8082
    reconciliation-timeout: 30s
  services:
    request-timeout: 5s
  cleanup:
    interval: 1h
    retention: 24h
  reporting:
    base-url: http://localhost:8084
    # Past Kafka's session timeout (45 s): a killed reporting instance's partitions move to another by then (ADR 0015).
    catch-up-wait: 60s
  prometheus:
    base-url: http://localhost:9090
    # Shorter than the services': it is read every tick for every live run.
    request-timeout: 1s

springdoc:
  # Each endpoint lists its own answers; otherwise every error handler is added to every operation.
  override-with-generic-response: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
