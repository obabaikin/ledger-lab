spring:
  application:
    name: control
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/ledgerlab
    username: control
    password: control
    hikari:
      schema: control
  flyway:
    default-schema: control

server:
  port: 8083

control:
  runs:
    max-active: 3
    max-queued: 10
    queue-timeout: 5m
    tps-options: 100, 500, 1000
    duration-options: 10s, 20s, 30s
  queue:
    poll-interval: 1s
  ledger:
    base-url: http://localhost:8080
    readiness-timeout: 2s

springdoc:
  # Each endpoint lists its own answers; otherwise every error handler is added to every operation.
  override-with-generic-response: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
