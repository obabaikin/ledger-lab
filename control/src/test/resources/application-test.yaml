spring:
  messages:
    # A key of its own shows how a mail text with an apostrophe is written.
    basename: i18n/mail,i18n/mail-test
control:
  periods:
    # Tests drive the conductor themselves.
    tick-interval: 1h
    # Above services.request-timeout, so a count slower than an ordinary call still counts.
    count-timeout: 2s
  outside:
    # Tests read the load above the promise themselves.
    load-poll-interval: 1h
  availability:
    poll-interval: 1h
  series:
    cache: 0s
  services:
    request-timeout: 500ms
  prometheus:
    # Through a placeholder: a dynamic property of the base test class would win over a subclass's real Prometheus (E100).
    base-url: ${stub.prometheus-url}
  invites:
    email:
      # Tests run the deletion tick themselves.
      deletion-check: 1h
  mail:
    # Tests send the due mails themselves, to a stub of the provider.
    send-interval: 1h
    api-key: test-key
    api-secret: test-secret
  site:
    base-url: https://ledger-lab.test
