spring:
  messages:
    # A key of its own shows how a mail text with an apostrophe is written.
    basename: i18n/mail,i18n/mail-test
control:
  queue:
    # Tests drive the queue and the conductor themselves.
    poll-interval: 1h
  runs:
    # The race tests start dozens of runs at once against the queue's lock; StartAdmissionTest holds the real bound.
    max-concurrent-starts: 100
  services:
    request-timeout: 500ms
  ledger:
    reconciliation-timeout: 500ms
  gateway:
    summary-timeout: 500ms
  generator:
    reconciliation-timeout: 500ms
  reporting:
    final-stats-timeout: 500ms
  prometheus:
    # Through a placeholder: a dynamic property of the base test class would win over a subclass's real Prometheus (E100).
    base-url: ${stub.prometheus-url}
  mail:
    # Tests send the due mails themselves, to a stub of the provider.
    send-interval: 1h
    api-key: test-key
    api-secret: test-secret
  site:
    base-url: https://ledger-lab.test
