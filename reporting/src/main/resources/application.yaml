spring:
  application:
    name: reporting
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/ledgerlab?reWriteBatchedInserts=true
    username: reporting
    password: reporting
    hikari:
      schema: reporting
  flyway:
    default-schema: reporting
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: reporting
      auto-offset-reset: earliest
      properties:
        max.poll.records: 500
    listener:
      concurrency: 3
      # Topics come from infrastructure (ADR 0008); a name that does not match fails the start.
      missing-topics-fatal: true

server:
  port: 8084

reporting:
  transfers-topic: transfers
  results-topic: transfer-results
  consumer:
    retry-backoff: 500ms
  periods:
    # The same in every service: they cut time at the same instants.
    length: 60m
    # How long a period's numbers and the rows of its transfers are held after it ended.
    retention: 4h
    # Every connection that reads a table keeps a cache entry per partition: 313 partitions took 21 MB a connection and
    # Postgres out of its memory (k3d, 10-minute periods). Maintenance creates them every minute.
    partitions-ahead: 6h
    maintenance-interval: 1m
    # Creating or dropping a partition holds up the consumers while it waits for the table.
    lock-timeout: 2s

springdoc:
  override-with-generic-response: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
